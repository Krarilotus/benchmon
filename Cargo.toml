[package]
name = "benchmon"
version = "0.4.0"
edition = "2021"
description = "A compact Windows monitor for local and SSH-connected machines, and its probes as a library"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Krarilotus/benchmon"
publish = false

# The panel is the default; `default-features = false` builds only the probes (the library).
[features]
default = ["gui"]
gui = ["dep:eframe"]

[lib]
name = "benchmon"
path = "src/lib.rs"

[[bin]]
name = "benchmon"
path = "src/main.rs"
required-features = ["gui"]

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["accesskit", "default_fonts", "glow"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
winresource = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
