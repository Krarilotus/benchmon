[package]
name = "benchmon"
version = "0.2.0"
edition = "2021"
description = "A compact Windows monitor for local and SSH-connected machines"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Krarilotus/benchmon"
publish = false

[dependencies]
eframe = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
